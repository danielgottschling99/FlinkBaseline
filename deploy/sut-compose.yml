services:
  jobmanager:
    image: flink:1.20.4-scala_2.12-java17
    ports:
      - "8081:8081"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
    networks:
      - benchmark-net

  taskmanager:
    image: flink:1.20.4-scala_2.12-java17
    depends_on:
      - jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: ${FLINK_TASK_SLOTS:-1}
    networks:
      - benchmark-net

networks:
  benchmark-net:
    external: true
